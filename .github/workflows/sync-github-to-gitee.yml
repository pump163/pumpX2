name: sync-github-to-gitee

# 将上游 jwoglom/pumpX2 纯镜像同步到 Gitee（只读支持库，镜像 main/dev/tags）
# 每天北京时间 04:00（UTC 20:00），与 controlX2 同步窗口一致
on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-gitee
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Bare clone upstream from GitHub
        run: |
          set -euo pipefail
          git clone --bare https://github.com/jwoglom/pumpX2.git mirror
          cd mirror
          git fetch origin '+refs/heads/*:refs/heads/*' --tags --prune --force

      - name: Push mirror to Gitee
        working-directory: mirror
        env:
          GITEE_USERNAME: ${{ secrets.GITEE_USERNAME }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -euo pipefail
          git remote add gitee "https://${GITEE_USERNAME}:${GITEE_TOKEN}@gitee.com/pumppan/pump-x2.git"
          # GitHub runner 到 Gitee 偶发 SSL timeout，最多重试 3 次，间隔 30s
          push_with_retry() {
            for i in 1 2 3; do
              if git push gitee --force refs/heads/main:refs/heads/main refs/heads/dev:refs/heads/dev \
                 && git push gitee --tags --force; then
                echo "push succeeded on attempt $i"
                return 0
              fi
              echo "push attempt $i failed, retrying in 30s..."
              sleep 30
            done
            echo "ERROR: all 3 push attempts failed"
            return 1
          }
          push_with_retry