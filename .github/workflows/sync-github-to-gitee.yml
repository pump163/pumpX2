name: sync-github-to-gitee

# 将上游 jwoglom/pumpX2 纯镜像同步到 Gitee（只读支持库，镜像 main/dev/tags）
# schedule 为美国东部时间 03:30：夏令时 EDT(UTC-4) = UTC 07:30；
# 冬令时 EST 期间实际为美东 02:30（GitHub cron 固定 UTC，不随 DST 自动调整）
on:
  schedule:
    - cron: '30 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-gitee
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Bare clone upstream from GitHub
        run: |
          set -euo pipefail
          git clone --bare https://github.com/jwoglom/pumpX2.git mirror
          cd mirror
          git fetch origin '+refs/heads/*:refs/heads/*' --tags --prune --force

      - name: Push mirror to Gitee
        working-directory: mirror
        env:
          GITEE_USERNAME: ${{ secrets.GITEE_USERNAME }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -euo pipefail
          git remote add gitee "https://${GITEE_USERNAME}:${GITEE_TOKEN}@gitee.com/pumppan/pump-x2.git"
          git push gitee --force refs/heads/main:refs/heads/main refs/heads/dev:refs/heads/dev
          git push gitee --tags --force